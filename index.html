<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>stopwatch</title>
</head>
<body>
    <main class="app">
        <h1 class="name">Stopwatch</h1>

        <section class="display">
            <p id="time">00:00:00</p>
        </section>

        <section class="controls">

            <button id="startBtn" aria-label="start"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
            <button id="pauseBtn" aria-label="pause"><i class="fa-solid fa-pause" aria-hidden="true"></i></button>
            <button id="resetBtn" aria-label="reset"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
            <button id="lapBtn" aria-label="lap"><i class="fa-solid fa-flag" aria-hidden="true"></i></button>

        </section>

        <section class="laps">
            <h2 class="lapsTitle">Laps</h2>

            <ul id="lapsList">
                <li class="lapItem">
                   <span class="lapNumber">Lap 1</span>
                   <span class="lapTime">00:00:05</span>
                </li>
            </ul>
        </section>

    </main>
    

    <script src="js/index.js"></script>
</body>
</html>
