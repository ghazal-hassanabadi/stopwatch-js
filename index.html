<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>TimeFlow</title>
</head>

    <header class="header">
       <h1 class="logo">
        <i class="fa-solid fa-stopwatch" aria-hidden="true"></i>
        <span>TimeFlow</span>
       </h1>
       
    </header>

<body>


    <main class="app">


        <nav class="modeSwitch">
            <button id="stopwatchTab" class="modeBtn active" type="button">Stopwatch</button>
            <button id="timerTab" class="modeBtn" type="button">Timer</button>
        </nav>

        <section id="stopwatchView" class="view">
            <section class="display">
                <p id="time">00:00:00</p>
            </section>

        <section class="controls">
            <button id="resetBtn" type="button" aria-label="reset"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
             <button id="toggleBtn" type="button" aria-label="start"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
            <button id="lapBtn" type="button" aria-label="lap"><i class="fa-solid fa-flag" aria-hidden="true"></i></button>
        </section>

            <section class="laps">
                <h2 class="lapsTitle">Laps</h2>
                <ul id="lapsList"></ul>
            </section>
        </section>

        <section id="timerView" class="view hidden">
            <section class="display">
                <p id="timerTime">00:05:00</p>
            </section>

            <p id="timerMessage" class="timerMessage"></p>
        <div class="timerSide">
            <div class="presets">
                <button class="presetBtn" type="button" data-minutes="5">5 min</button>
                <button class="presetBtn" type="button" data-minutes="10">10 min</button>
                <button class="presetBtn" type="button" data-minutes="25">25 min</button>
            </div>

            <div class="customTime">
                <input id="timerMinutes" type="number" min="0" max="99" placeholder="Min" aria-label="minutes">
                <input id="timerSeconds" type="number" min="0" max="59" placeholder="Sec" aria-label="seconds">
                <button id="timerSetBtn" type="button">Set</button>
            </div>
        </div>
            <section class="controls">
                <button id="timerToggleBtn" type="button" aria-label="start"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
                <button id="timerResetBtn" type="button" aria-label="reset"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
            </section>
        </section>


    </main>

    <script type="module" src="js/index.js"></script>
</body>
</html>
